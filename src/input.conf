# The embedded mpv child receives input inside the video surface.
# Keep bindings intentionally small and mirror the host shortcuts.
SPACE cycle pause
LEFT seek -5 relative+exact
RIGHT seek 5 relative+exact
UP add volume 5
DOWN add volume -5
m cycle mute
M cycle mute
f script-message luma-toggle-fullscreen
F script-message luma-toggle-fullscreen
ESC script-message luma-exit-fullscreen
MOUSE_BTN0_DBL script-message luma-toggle-fullscreen
